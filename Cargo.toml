[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hub-core", "crates/hub-blender", "crates/hub-render", "crates/hub-mcp", "crates/hub-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
repository = "https://github.com/roadkill951381/Rust-Hub"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-blender = { path = "crates/hub-blender" }
hub-render = { path = "crates/hub-render" }
hub-mcp = { path = "crates/hub-mcp" }

anyhow = "1.0"
bytemuck = "1.25"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.37"
egui-wgpu = "0.37"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
gltf = { version = "1.4", default-features = false, features = ["import", "names", "utils"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
quick-xml = "0.42"
rfd = "0.17"
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stl_io = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow" # geometry code reads best as a, b, c

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
